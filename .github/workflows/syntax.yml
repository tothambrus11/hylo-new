name: Hylo IR syntax

# Checks the Hylo IR grammar against the IR the compiler's tests expect, so that a change to the
# IR printer that the grammar does not cover is noticed.
on:
  pull_request:
    paths:
      - "Tools/syntax/**"
      - "Sources/FrontEnd/IR/**"
      - "Tests/CompilerTests/**/*-ir.expected"
      - ".github/workflows/syntax.yml"
  push:
    branches:
      - main
    paths:
      - "Tools/syntax/**"
      - "Sources/FrontEnd/IR/**"
      - "Tests/CompilerTests/**/*-ir.expected"

jobs:
  test:
    name: Highlight the expected IR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "24.x"
      - run: npm ci --no-audit --no-fund
        working-directory: Tools/syntax
      - run: npm test
        working-directory: Tools/syntax
