name: Compiler on WebAssembly

# Builds the whole compiler, LLVM back end and in-process linker included, for WebAssembly, checks
# that it compiles and runs programs, and publishes it on `wasm-v*` tags. See Tools/wasm/README.md.
on:
  push:
    branches:
      - main
    tags:
      - "wasm-v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths:
      - "Tools/wasm/**"
      - ".github/workflows/wasm-compiler.yml"
      - "Package.swift"
      - "Swifty-LLVM"
  workflow_dispatch:

# The LLVM build is the whole cost model here: cold, it is hours; warm, it is a cache restore. A
# build whose value is its cache must not be cancelled half way by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the pinned inputs
        id: meta
        run: |
          source Tools/wasm/config.sh
          # Everything that decides the contents of the wasm LLVM, hashed into its cache key.
          llvm="$(cat Tools/wasm/config.sh Tools/wasm/build-llvm.sh Tools/wasm/wasi-toolchain.cmake \
            Tools/wasm/patches/*.patch | sha256sum | cut -c1-16)"
          echo "llvm_key=llvm-wasm-$LLVM_TAG-swift-$SWIFT_VERSION-$llvm" >> "$GITHUB_OUTPUT"
          echo "swift=$SWIFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "sdk_url=$SWIFT_SDK_URL" >> "$GITHUB_OUTPUT"
          echo "sdk_checksum=$SWIFT_SDK_CHECKSUM" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/wasm-v* ]]; then
            echo "version=${GITHUB_REF_NAME#wasm-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Swift ${{ steps.meta.outputs.swift }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ steps.meta.outputs.swift }}

      - name: Install the Swift SDK for WebAssembly
        run: >
          swift sdk install "${{ steps.meta.outputs.sdk_url }}"
          --checksum "${{ steps.meta.outputs.sdk_checksum }}"

      # The installed LLVM is the only thing the rest of the job needs from the LLVM build, so a
      # hit here skips it entirely.
      - name: Restore the wasm LLVM
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}

      - name: Free disk space
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install the LLVM build's tools
        if: steps.llvm.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # A cold LLVM build may not fit in one job. Whatever a run built is saved even when it fails
      # or times out, and the next run resumes from it rather than starting over.
      - name: Restore a partial LLVM build
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/hylo-wasm
            !~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}-partial-${{ github.run_id }}
          restore-keys: ${{ steps.meta.outputs.llvm_key }}-partial-

      - name: Build LLVM for WebAssembly
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          Tools/wasm/build-llvm.sh --stamp-only
          Tools/wasm/build-llvm.sh

      - name: Save the partial LLVM build
        if: steps.llvm.outputs.cache-hit != 'true' && (failure() || cancelled())
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/hylo-wasm
            !~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}-partial-${{ github.run_id }}

      - name: Save the wasm LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}

      - name: Set up binaryen
        run: |
          VERSION=version_132
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$VERSION/binaryen-$VERSION-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$VERSION/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "24.x"

      - name: Build the compiler for WebAssembly
        run: Tools/wasm/build-compiler.sh release

      - name: Install the loader's dependencies
        working-directory: Tools/wasm/js
        run: npm install --no-audit --no-fund

      - name: Compile and run programs with it
        run: node Tools/wasm/js/smoke.mjs Tools/wasm/.build/dist

      # The compiler's own test cases, held to what they expect of the native compiler.
      - name: Run the compiler tests through it
        run: node Tools/wasm/js/conformance.mjs Tools/wasm/.build/dist Tests/CompilerTests

      - name: Package the release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SWIFT_VERSION: ${{ steps.meta.outputs.swift }}
        run: |
          source Tools/wasm/config.sh
          export LLVM_TAG
          node Tools/wasm/js/package-release.mjs Tools/wasm/.build/dist "$VERSION" release \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # A release is loaded through its manifest, by a page, which is a different code path from the
      # checks above. Playwright is not a dependency of the loader, so it is installed here.
      - name: Load the release in a browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            node Tools/wasm/js/browser-smoke.mjs release

      - uses: actions/upload-artifact@v7
        with:
          name: hylo-wasm-${{ steps.meta.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  # A tag publishes what the build job produced and checked. Nothing is rebuilt here.
  release:
    if: startsWith(github.ref, 'refs/tags/wasm-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hylo-wasm-${{ needs.build.outputs.version }}
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            --latest=false || true
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
