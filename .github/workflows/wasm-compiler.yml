name: Compiler on WebAssembly

# Builds the whole compiler, LLVM back end and in-process linker included, for WebAssembly, and
# checks that it compiles and runs programs. `release.yml` calls this to build the release's
# WebAssembly distributable. See Tools/wasm/README.md.
on:
  push:
    branches:
      - main
    paths: &paths
      - "Sources/**"
      - "StandardLibrary/**"
      - "Tests/CompilerTests/**"
      - "Tools/wasm/**"
      - "Package.swift"
      - "Package.resolved"
      - "Swifty-LLVM"
      - ".github/workflows/wasm-compiler.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version the release records, such as `v1.2.0`, whose `v` is dropped.
        type: string
        required: true
    outputs:
      artifact:
        description: The name of the artifact holding the packaged release.
        value: ${{ jobs.build.outputs.artifact }}

# The LLVM build is the whole cost model here: cold, it is hours; warm, it is a cache restore. A
# build whose value is its cache must not be cancelled half way by a later push.
concurrency:
  group: wasm-compiler-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact: hylo-wasm-${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the pinned inputs
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source Tools/wasm/config.sh
          # Everything that decides the contents of the wasm LLVM, hashed into its cache key.
          llvm="$(cat Tools/wasm/config.sh Tools/wasm/build-llvm.sh Tools/wasm/wasi-toolchain.cmake \
            Tools/wasm/patches/*.patch | sha256sum | cut -c1-16)"
          {
            echo "llvm_key=llvm-wasm-$LLVM_TAG-swift-$SWIFT_VERSION-$llvm"
            echo "swift=$SWIFT_VERSION"
            echo "sdk_url=$SWIFT_SDK_URL"
            echo "sdk_checksum=$SWIFT_SDK_CHECKSUM"
            echo "binaryen_version=$BINARYEN_VERSION"
            echo "binaryen_url=$BINARYEN_URL"
            echo "binaryen_checksum=$BINARYEN_CHECKSUM"
            version="${VERSION#v}"
            echo "version=${version:-0.0.0-${GITHUB_SHA::12}}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Swift ${{ steps.meta.outputs.swift }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ steps.meta.outputs.swift }}

      - name: Install the Swift SDK for WebAssembly
        run: >
          swift sdk install "${{ steps.meta.outputs.sdk_url }}"
          --checksum "${{ steps.meta.outputs.sdk_checksum }}"

      # The installed LLVM is the only thing the rest of the job needs from the LLVM build, so a
      # hit here skips it entirely.
      - name: Restore the wasm LLVM
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}

      - name: Free disk space
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install the LLVM build's tools
        if: steps.llvm.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # A cold LLVM build may not fit in one job. Whatever a run built is saved when it fails or
      # runs out of time, with the stamps of the steps it completed, and the next run resumes from
      # it rather than starting over.
      - name: Restore a partial LLVM build
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/hylo-wasm
            !~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}-partial-${{ github.run_id }}
          restore-keys: ${{ steps.meta.outputs.llvm_key }}-partial-

      # Bounded below the job's own limit, so that a build running out of time fails this step
      # and leaves time to save what it built.
      - name: Build LLVM for WebAssembly
        if: steps.llvm.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: Tools/wasm/build-llvm.sh

      - name: Save the partial LLVM build
        if: steps.llvm.outputs.cache-hit != 'true' && (failure() || cancelled())
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/hylo-wasm
            !~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}-partial-${{ github.run_id }}

      - name: Save the wasm LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/hylo-wasm/llvm-wasm
          key: ${{ steps.meta.outputs.llvm_key }}

      - name: Set up binaryen
        env:
          URL: ${{ steps.meta.outputs.binaryen_url }}
          CHECKSUM: ${{ steps.meta.outputs.binaryen_checksum }}
          VERSION: ${{ steps.meta.outputs.binaryen_version }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" "$URL"
          echo "$CHECKSUM  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$VERSION/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "24.x"

      - name: Build the compiler for WebAssembly
        run: Tools/wasm/build-compiler.sh release

      - name: Install the loader's dependencies
        working-directory: Tools/wasm/js
        run: npm ci --no-audit --no-fund

      - name: Compile and run programs with it
        run: node Tools/wasm/js/smoke.mjs Tools/wasm/.build/dist

      # The compiler's own test cases, held to what they expect of the native compiler.
      - name: Run the compiler tests through it
        run: node Tools/wasm/js/conformance.mjs Tools/wasm/.build/dist Tests/CompilerTests

      - name: Package the release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SWIFT_VERSION: ${{ steps.meta.outputs.swift }}
        run: |
          source Tools/wasm/config.sh
          export LLVM_TAG
          node Tools/wasm/js/package-release.mjs Tools/wasm/.build/dist "$VERSION" \
            Tools/wasm/.build/release | tee -a "$GITHUB_STEP_SUMMARY"
          node Tools/wasm/js/verify-release.mjs Tools/wasm/.build/release "$VERSION"

      # A release is loaded through its manifest, by a page, which is a different code path from the
      # checks above. Playwright is not a dependency of the loader, so it is installed here.
      - name: Load the release in a browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            node Tools/wasm/js/browser-smoke.mjs Tools/wasm/.build/release

      - uses: actions/upload-artifact@v7
        with:
          name: hylo-wasm-${{ steps.meta.outputs.version }}
          path: Tools/wasm/.build/release/
          if-no-files-found: error
          retention-days: 30
