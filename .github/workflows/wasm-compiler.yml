name: Compiler on WebAssembly

# Builds the whole compiler, LLVM back end and in-process linker included, for WebAssembly, and
# checks that it compiles and runs programs. `release.yml` calls this to build the release's
# WebAssembly distributable. See Sources/WASM/README.md.
on:
  push:
    branches:
      - main
    paths: &paths
      - "Sources/**"
      - "StandardLibrary/**"
      - "Tests/CompilerTests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Swifty-LLVM"
      - ".github/workflows/wasm-compiler.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version the release records, such as `v1.2.0`, whose `v` is dropped.
        type: string
        required: true
    outputs:
      artifact:
        description: The name of the artifact holding the packaged release.
        value: ${{ jobs.build.outputs.artifact }}

concurrency:
  group: wasm-compiler-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact: hylo-wasm-${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the pinned inputs
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source Sources/WASM/scripts/config.sh
          {
            echo "swift=$SWIFT_VERSION"
            echo "sdk_url=$SWIFT_SDK_URL"
            echo "sdk_checksum=$SWIFT_SDK_CHECKSUM"
            echo "binaryen_version=$BINARYEN_VERSION"
            echo "binaryen_url=$BINARYEN_URL"
            echo "binaryen_checksum=$BINARYEN_CHECKSUM"
            version="${VERSION#v}"
            echo "version=${version:-0.0.0-${GITHUB_SHA::12}}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Swift ${{ steps.meta.outputs.swift }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ steps.meta.outputs.swift }}

      - name: Install the Swift SDK for WebAssembly
        run: >
          swift sdk install "${{ steps.meta.outputs.sdk_url }}"
          --checksum "${{ steps.meta.outputs.sdk_checksum }}"

      # Built by hylo-lang/llvm-build, at the release and checksum pinned in config.sh.
      - name: Download the wasm LLVM
        run: Sources/WASM/scripts/fetch-llvm.sh

      - name: Set up binaryen
        env:
          URL: ${{ steps.meta.outputs.binaryen_url }}
          CHECKSUM: ${{ steps.meta.outputs.binaryen_checksum }}
          VERSION: ${{ steps.meta.outputs.binaryen_version }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" "$URL"
          echo "$CHECKSUM  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$VERSION/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "24.x"

      - name: Build the compiler for WebAssembly
        run: Sources/WASM/scripts/build-compiler.sh release

      - name: Install the JavaScript package's dependencies
        working-directory: Sources/WASM/js
        run: npm ci --no-audit --no-fund

      - name: Check the JavaScript package
        working-directory: Sources/WASM/js
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build

      # The smoke test, and the compiler's own test cases, held to what they expect of the native
      # compiler, against what the build step produced.
      - name: Test the compiler through the package
        working-directory: Sources/WASM/js
        run: npm test

      - name: Package the release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SWIFT_VERSION: ${{ steps.meta.outputs.swift }}
        run: |
          source Sources/WASM/scripts/config.sh
          export LLVM_VERSION LLVM_BUILD_RELEASE
          node Sources/WASM/js/scripts/package-release.ts .build/wasm/dist "$VERSION" \
            .build/wasm/release | tee -a "$GITHUB_STEP_SUMMARY"
          node Sources/WASM/js/scripts/verify-release.ts .build/wasm/release "$VERSION"

      # A release is loaded through its manifest, by a page, which is a different code path from the
      # tests above.
      - name: Load the release in a browser
        working-directory: Sources/WASM/js
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      # The package as its users get it, rather than its sources, which the tests above import.
      - name: Test the packed package
        working-directory: Sources/WASM/js
        run: |
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          node scripts/smoke-test-package.ts "$RUNNER_TEMP/$tarball" ../../../.build/wasm/release

      - uses: actions/upload-artifact@v7
        with:
          name: hylo-wasm-${{ steps.meta.outputs.version }}
          path: .build/wasm/release/
          if-no-files-found: error
          retention-days: 30
