name: Publish release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1

jobs:
  prepare-draft-release:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --repo "$REPOSITORY" --draft --generate-notes --latest=false --title "$TAG"
        shell: bash

  build-distributable:
    name: Build distributable for ${{ matrix.target }}
    needs: prepare-draft-release
    strategy: &distributable-strategy
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-26,         target: macos-arm64 }
          - { os: macos-26-intel,   target: macos-x64 }
          - { os: windows-2025,     target: windows-x64 }
          - { os: windows-11-arm,   target: windows-arm64 }

    runs-on: ${{ matrix.os }}
    env: &distributable-env
      ARTIFACT_NAME: hylo-${{ github.ref_name }}-${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.2"

      - name: Set up LLVM
        uses: hylo-lang/get-llvm@6a49368ad6b8b735b444d4b9840b0bc466e7875a # v0.4.0
        id: get-llvm
        with:
          llvmVersion: "23.1.0"
          llvmBuildRelease: "20260905-220739"
          llvmBuildConfig: MinSizeRel
          addToPkgConfigPath: true
          addToPath: true

      - name: Embed release version
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          "internal let hyloVersion = `"$version`"" | Set-Content Sources/hc/Version.swift
        shell: pwsh

      - name: Download Recent Visual Studio and Windows SDK
        uses: compnerd/gha-setup-vsdevenv@main
        with:
          winsdk: "10.0.26100.0"
          # Note: The GitHub windows-2025 runner has only a very old version of the Windows SDK available by default.
          #       Swift is said to require version 10.0.22621.0: https://forums.swift.org/t/swiftpm-plugin-doesnt-work-with-the-latest-visual-studio-version/78183/14
          #       That no longer works, so we had to upgrade to 10.0.26100.0.
          #       See also: https://github.com/swiftlang/swift/issues/88237

      - name: Build distributable
        run: swift build -c release --verbose --product hc --static-swift-stdlib -Xswiftc -DUSE_BUNDLED_STANDARD_LIBRARY -Xswiftc -DSWIFTY_LLVM_CROSS_COMPILATION_ENABLED -Xswiftc -cross-module-optimization
        shell: pwsh

      - name: Locate distributable
        id: locate-distributable
        run: |
          $ErrorActionPreference = 'Stop'
          $binPath = (swift build -c release --product hc --static-swift-stdlib -Xswiftc -DUSE_BUNDLED_STANDARD_LIBRARY -Xswiftc -DSWIFTY_LLVM_CROSS_COMPILATION_ENABLED -Xswiftc -cross-module-optimization --show-bin-path).Trim()
          $binaryName = if ($env:RUNNER_OS -eq 'Windows') { 'hc.exe' } else { 'hc' }
          "bin_path=$binPath" >> $env:GITHUB_OUTPUT
          "binary_path=$(Join-Path $binPath $binaryName)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Assemble portable bundle
        uses: hylo-lang/swift-portable-tool-bundler@v1.0.0
        with:
          products: hc
          output-directory: ${{ runner.temp }}/bundle

      - name: Archive distributable
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP "$env:ARTIFACT_NAME.tar.zst"
          if (Test-Path $archivePath) {
            Remove-Item -Force $archivePath
          }
          tar --zstd -cf $archivePath -C "${{ runner.temp }}/bundle" .
        shell: pwsh

      - name: Upload distributable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}.tar.zst
          if-no-files-found: error
          retention-days: 2

  verify-and-publish-distributable:
    name: Verify and publish distributable for ${{ matrix.target }}
    needs: build-distributable
    strategy: *distributable-strategy
    runs-on: ${{ matrix.os }}
    env: *distributable-env

    steps:
      - name: Download distributable artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/dist

      - name: Verify distributable in a Swift-free environment
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "dist/$env:ARTIFACT_NAME.tar.zst"
          $extractDir = Join-Path $env:RUNNER_TEMP 'extracted'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar --zstd -xf $archive -C $extractDir

          $binaryName = if ($env:RUNNER_OS -eq 'Windows') { 'hc.exe' } else { 'hc' }
          $binary = Join-Path $extractDir $binaryName
          $expectedVersion = $env:RELEASE_TAG -replace '^v', ''
          $actualVersion = (& $binary --version).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Expected version '$expectedVersion', got '$actualVersion'"
          }
        shell: pwsh

      - name: Upload distributable to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "dist/$env:ARTIFACT_NAME.tar.zst"
          gh release upload $env:TAG $archive --repo '${{ github.repository }}' --clobber
        shell: pwsh

  # The compiler built for WebAssembly, to run in a browser. It is built and checked by the same
  # workflow that checks it on every change.
  build-wasm-distributable:
    name: Build distributable for wasm32-wasip1
    needs: prepare-draft-release
    uses: ./.github/workflows/wasm-compiler.yml
    with:
      version: ${{ github.ref_name }}

  verify-and-publish-wasm-distributable:
    name: Verify and publish distributable for wasm32-wasip1
    needs: build-wasm-distributable
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: hylo-${{ github.ref_name }}-wasm32-wasip1

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Sources/WASM/js

      # Runs the verification script, written in TypeScript, as it is.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "24.x"

      - name: Download distributable artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-wasm-distributable.outputs.artifact }}
          path: ${{ runner.temp }}/release

      - name: Verify distributable in a Swift-free environment
        run: node Sources/WASM/js/scripts/verify-release.ts "$RUNNER_TEMP/release" "${GITHUB_REF_NAME#v}"

      - name: Upload distributable to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar --zstd -cf "$RUNNER_TEMP/$ARTIFACT_NAME.tar.zst" -C "$RUNNER_TEMP/release" .
          gh release upload "$TAG" "$RUNNER_TEMP/$ARTIFACT_NAME.tar.zst" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The JavaScript package that loads the compiler, `@hylo-lang/hylo-wasm`, at the release's version
  # (`v1.2.0` publishes 1.2.0), once the compiler it loads has been published and checked. The
  # build job has already type-checked, linted and tested it. npm's trusted publishing
  # authenticates the job through GitHub's OIDC token, so no token is stored, and records where the
  # package was built as its provenance.
  publish-npm-package:
    name: Publish the npm package
    needs: [build-wasm-distributable, verify-and-publish-wasm-distributable]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Sources/WASM/js

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Build the package
        working-directory: Sources/WASM/js
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # A pre-release (`v1.2.0-rc.1`) is published under the `next` tag, so that it is not what
      # `npm install` picks by default. npm checks the package's repository against the one
      # publishing it, which is this one.
      - name: Publish
        working-directory: Sources/WASM/js
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          npm version "$version" --no-git-tag-version
          npm pkg set "repository.url=git+https://github.com/$GITHUB_REPOSITORY.git"
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish --tag "$dist_tag"
